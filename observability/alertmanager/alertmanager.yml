global:
  resolve_timeout: 1m

route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 5s
  group_interval: 10s
  repeat_interval: 1m
  receiver: 'ai-oncall-agent'

receivers:
  - name: 'ai-oncall-agent'
    webhook_configs:
      - url: 'http://ai-responder:8080/webhook/alert'
        send_resolved: true
        max_alerts: 10
